; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_type = release

[env:esp32-s3-devkitm-1-debug]
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_type = debug

[env:native]
platform = native
test_build_src = yes
build_src_filter =
  +<bems_crypto.c>
  +<mesh_protocol.c>
  +<mesh/mesh_sequence.c>
  +<mesh/replay_protection.c>
  +<mesh/tx_scheduler.c>
  +<route_table.c>
  +<roster.c>
  +<network/dns_server.c>
  +<utils/string_utils.c>
  +<utils/json_utils.c>
  +<messages/message_store.c>
  +<app/app_runtime.c>
  +<mesh_control.c>
lib_deps = throwtheswitch/Unity
build_flags = -I test/native_stubs
