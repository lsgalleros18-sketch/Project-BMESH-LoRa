<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restarting...</title><style>:root{--bg:#f5f7f6;--surface:#fff;--line:#dfe6e2;--text:#16231e;--muted:#66736d;--accent:#21735b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}.appbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{width:min(100% - 32px,520px);margin:auto;display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:50%;background:var(--accent)}.brand b{display:block;font-size:18px}.brand small,.muted{color:var(--muted);font-size:13px}.wrap{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:30px 16px}.card{width:min(100%,460px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;box-shadow:0 4px 14px rgba(22,35,30,.04)}.spinner{width:38px;height:38px;border:4px solid #dfece6;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}@keyframes spin{to{transform:rotate(360deg)}}h1{margin:0;font-size:23px}.count{margin:14px 0 8px;font-size:30px;font-weight:750;color:var(--accent)}p{line-height:1.5;margin:0}.status{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}@media(max-width:480px){.card{padding:22px}}</style></head><body><header class="appbar"><div class="brand"><span class="mark"></span><div><b>Barangay Mesh</b><small>Emergency Communication</small></div></div></header><main class="wrap"><section class="card"><div class="spinner"></div><h1>Restarting node...</h1><div class="count" id="count">15</div><p class="muted" id="msg">Please reconnect to the Wi-Fi AP for this node. The portal will retry automatically.</p><p class="muted status" id="ssid">Waiting for the node to come back online.</p></section></main><script>let s=15;const ap='192.168.4.1';function tick(){document.getElementById('count').textContent=s;if(s<=0)return;setTimeout(tick,1000);s--;}tick();let tries=0;async function probe(){tries++;try{let r=await fetch('http://192.168.4.1/api/status',{cache:'no-store'});if(r.ok){window.location.href='/';return;}}catch(e){}setTimeout(probe,2000);}setTimeout(probe,16000);</script></body></html>
