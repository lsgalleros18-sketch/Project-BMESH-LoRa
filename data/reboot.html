<!doctype html><html><head><meta name=viewport content='width=device-width,initial-scale=1'><title>Restarting...</title><style>:root{font-family:Arial,sans-serif;color:#17202a;background:#f5f7f9}body{margin:0}.wrap{max-width:520px;margin:auto;padding:24px}.card{background:white;border:1px solid #d8dee4;border-radius:12px;padding:20px}.spinner{width:36px;height:36px;border:4px solid #e5e7eb;border-top-color:#1f6f5b;border-radius:50%;animation:spin .8s linear infinite;margin:10px 0}@keyframes spin{to{transform:rotate(360deg)}}.muted{color:#5f6b7a;font-size:14px}.count{font-size:34px;font-weight:800;color:#1f6f5b}</style></head><body><main class=wrap><section class=card><div class=spinner></div><h2>Setup saved. Node is restarting.</h2><div class=count id=count>15</div><p class=muted id=msg>Please reconnect to the Wi-Fi AP for this node, then the page will retry automatically.</p><p class=muted id=ssid></p></section></main><script>let s=15;const ap='192.168.4.1';function tick(){document.getElementById('count').textContent=s;if(s<=0)return;setTimeout(tick,1000);s--;}tick();let tries=0;async function probe(){tries++;try{let r=await fetch('http://192.168.4.1/api/status',{cache:'no-store'});if(r.ok){window.location.href='/';return;}}catch(e){}setTimeout(probe,2000);}setTimeout(probe,16000);</script></body></html>
