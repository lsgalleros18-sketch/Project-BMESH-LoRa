ementById('langBtn'),backBtn=document.getElementById('backBtn'),sendForm=document.getElementById('sendForm'),sendStatus=document.getElementById('sendStatus'),senderName=document.getElementById('senderName'),destination=document.getElementById('destination'),typeSelect=document.getElementById('typeSelect'),prioritySelect=document.getElementById('prioritySelect'),msgType=document.getElementById('msgType'),msgPriority=document.getElementById('msgPriority'),payload=document.getElementById('payload'),destTrigger=document.getElementById('destTrigger'),destTriggerLabel=document.getElementById('destTriggerLabel'),destMenu=document.getElementById('destMenu');const sidebarCollapsedKey='sidebarCollapsed';function setSidebarCollapsed(collapsed){document.querySelector('.app').classList.toggle('sidebar-collapsed',collapsed);if(sidebarToggle){sidebarToggle.setAttribute('aria-expanded',String(!collapsed));}try{localStorage.setItem(sidebarCollapsedKey,collapsed?'1':'0');}catch(e){}}function toggleSidebarCollapsed(){setSidebarCollapsed(!document.querySelector('.app').classList.contains('sidebar-collapsed'));}function isSmallViewport(){return window.matchMedia('(max-width: 760px)').matches;}try{setSidebarCollapsed(localStorage.getItem(sidebarCollapsedKey)==='1');}catch(e){}function setSendStatus(message,isError){if(!sendStatus)return;sendStatus.textContent=message||'';sendStatus.style.color=isError?'var(--red)':'var(--muted)';}function clearSendStatus(){setSendStatus('');}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function fmtEpoch(e){return e?new Date(e*1000).toLocaleString():'time unknown';}function fmtAgo(e){if(!e)return 'unknown';let diff=Math.floor(Date.now()/1000)-e;if(diff<60)return 'just now';if(diff<3600)return Math.floor(diff/60)+'m ago';if(diff<86400)return Math.floor(diff/3600)+'h ago';return Math.floor(diff/86400)+'d ago';}function fmtShort(e){if(!e)return '';let d=ne
