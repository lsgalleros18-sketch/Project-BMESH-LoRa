<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barangay Mesh Login</title><style>
:root{--bg:#f5f7f6;--surface:#fff;--line:#dfe6e2;--text:#16231e;--muted:#66736d;--accent:#21735b;--accent-dark:#185743;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}.appbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.appbar-inner,.wrap{width:min(100% - 32px,1200px);margin:auto}.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:50%;background:var(--accent);position:relative}.mark:before,.mark:after{content:"";position:absolute;background:#fff;border-radius:50%}.mark:before{width:7px;height:7px;top:7px;left:7px;box-shadow:13px 8px #fff}.mark:after{width:5px;height:5px;left:9px;bottom:7px}.brand b{font-size:18px;display:block}.brand small{font-size:12px;color:var(--muted)}.login-area{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:32px 0}.card{width:min(100%,420px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 4px 14px rgba(22,35,30,.04)}h1{margin:0 0 6px;font-size:24px}p{line-height:1.5}.muted{color:var(--muted);font-size:13px;margin:0}form{margin-top:24px}label{display:block;font-size:14px;font-weight:650;margin-bottom:8px}input{width:100%;height:46px;padding:0 13px;margin-top:7px;border:1px solid #bcc9c2;border-radius:9px;background:#fff;color:var(--text);font:inherit}input:focus{outline:3px solid rgba(33,115,91,.16);border-color:var(--accent)}button{width:100%;height:46px;margin-top:18px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:700 14px inherit;cursor:pointer}button:hover{background:var(--accent-dark)}.hint{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}@media(max-width:480px){.appbar-inner,.wrap{width:min(100% - 24px,1200px)}.login-area{padding:20px 0;align-items:start}.card{padding:22px;margin-top:20px}}
</style></head><body><header class="appbar"><div class="appbar-inner"><div class="brand"><span class="mark"></span><div><b>Barangay Mesh</b><small>Emergency Communication</small></div></div></div></header><main class="wrap login-area"><section class="card"><h1>Welcome back</h1><p class="muted">Unlock the Barangay Mesh portal to continue.</p><form method="post" action="/login"><label>Portal PIN<input name="pin" maxlength="31" type="password" required></label><button type="submit">Unlock Portal</button></form><p class="muted hint">Use the shared PIN configured for this node.</p></section></main></body></html>
