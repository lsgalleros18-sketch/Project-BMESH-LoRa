<!doctype html><html><head><meta name=viewport content='width=device-width,initial-scale=1'><title>Setup Barangay Mesh</title><style>:root{font-family:Arial,sans-serif;color:#17202a;background:#f5f7f9}body{margin:0}.top{background:#1f6f5b;color:white;padding:16px}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:white;border:1px solid #d8dee4;border-radius:8px;padding:16px;margin:12px 0}label{display:block;font-weight:700;margin-top:12px}input,button,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin-top:6px;border-radius:6px;border:1px solid #b8c0cc}button{background:#1f6f5b;color:white;border:0;font-weight:700;margin-top:16px}.muted{color:#5f6b7a;font-size:14px}</style></head><body><div class=top><div class=wrap><h2>First-Time Node Setup</h2><p>Configure this universal mesh node once. All nodes still send, receive, and relay.</p></div></div><main class=wrap><section class=card><form method=post action=/setup><label>Node ID<input name=node_id maxlength=31 placeholder='Example: BRGY001, HH023, RELAY04' required></label><label>Node Name<input name=node_name maxlength=31 placeholder='Example: Barangay Hall or House 23' required></label><label>Node Role<select name=node_role><option value='relay-only'>Relay / Listener</option><option value='household'>Household</option><option value='command-post'>Command Post</option></select></label><label>Default Priority<select name=default_priority><option>HIGH</option><option selected>NORMAL</option><option>LOW</option></select></label><label>Sitio / Landmark<input name=sitio maxlength=23 placeholder='Example: Purok 3, Chapel Roof'></label><label>Barangay<input name=barangay maxlength=23 placeholder='Example: San Isidro' required></label><label>Municipality<input name=municipality maxlength=23 placeholder='Example: Cabuyao'></label><label>Default Destination<input name=default_destination maxlength=31 value='BRGY001' placeholder='Example: ALL or BRGY001'></label><label>AP Password<input name=ap_password maxlength=31 value='123456789' placeholder='Wi-Fi hotspot password (8+ chars)'></label><label>Web PIN<input name=web_pin maxlength=31 value='123456789' placeholder='Shared portal PIN' required></label><label>Duress PIN<input name=duress_pin maxlength=31 placeholder='Visible emergency-only PIN used to signal distress'></label><label>Network Key<input name=network_key maxlength=31 value='CHANGEME1234567' placeholder='Shared mesh encryption key' required></label><button type=submit>Save Setup and Reboot</button></form><p class=muted>Factory reset later by holding BOOT for 10 seconds during startup.</p></section></main></body></html>
